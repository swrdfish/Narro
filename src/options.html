<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Narro</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1 class="wordmark"><img src="icons/narro.svg" width="28" height="28" alt=""> Narro</h1>
      <div class="actions">
        <button id="pick" class="secondary" title="Click any sentence on the page to start there">Start from…</button>
        <button id="read" class="primary">Read this page</button>
      </div>
    </header>

    <section>
      <label class="field">
        <span>Voice engine</span>
        <select id="engine">
          <optgroup label="Cloud">
            <option value="openai">OpenAI</option>
            <option value="elevenlabs">ElevenLabs</option>
            <option value="gemini">Google Gemini</option>
          </optgroup>
          <optgroup label="Local">
            <option value="kokoro">Kokoro — runs in your browser</option>
            <option value="localServer">Local server (OpenAI-compatible)</option>
            <option value="system">System voices</option>
          </optgroup>
        </select>
      </label>

      <div class="engine" data-engine="openai">
        <div class="field"><label for="openai-key">API key</label>
          <div class="secret"><input id="openai-key" type="password" data-key="openai.apiKey" placeholder="sk-…" autocomplete="off" spellcheck="false"></div></div>
        <label class="field"><span>Model</span><select data-key="openai.model" id="openai-models"></select></label>
        <label class="field"><span>Voice</span><select data-key="openai.voice" id="openai-voices"></select></label>
        <label class="field" id="openai-style"><span>Style instructions</span><textarea data-key="openai.instructions" rows="2"></textarea></label>
      </div>

      <div class="engine" data-engine="elevenlabs">
        <div class="field"><label for="elevenlabs-key">API key</label>
          <div class="secret"><input id="elevenlabs-key" type="password" data-key="elevenlabs.apiKey" autocomplete="off" spellcheck="false"></div></div>
        <label class="field"><span>Model</span><select data-key="elevenlabs.model" id="elevenlabs-models"></select></label>
        <label class="field"><span>Voice</span><select data-key="elevenlabs.voiceId" id="elevenlabs-voices"></select></label>
      </div>

      <div class="engine" data-engine="gemini">
        <div class="field"><label for="gemini-key">API key</label>
          <div class="secret"><input id="gemini-key" type="password" data-key="gemini.apiKey" autocomplete="off" spellcheck="false"></div></div>
        <label class="field"><span>Model</span><select data-key="gemini.model" id="gemini-models"></select></label>
        <label class="field"><span>Voice</span><select data-key="gemini.voice" id="gemini-voices"></select></label>
      </div>

      <div class="engine" data-engine="kokoro">
        <p class="note">Kokoro-82M runs entirely on your machine. The first use downloads the model (~90 MB on CPU, ~300 MB with WebGPU); after that it works offline.</p>
        <label class="field"><span>Voice</span><select data-key="kokoro.voice" id="kokoro-voices"></select></label>
        <label class="field"><span>Device</span>
          <select data-key="kokoro.device">
            <option value="auto">Auto (WebGPU if available)</option>
            <option value="webgpu">WebGPU</option>
            <option value="wasm">CPU (WASM)</option>
          </select>
        </label>
      </div>

      <div class="engine" data-engine="localServer">
        <p class="note">Point at any server exposing <code>/v1/audio/speech</code>, e.g. Kokoro-FastAPI, Orpheus-FastAPI or LocalAI.</p>
        <label class="field"><span>Base URL</span><input data-key="localServer.baseUrl" placeholder="http://localhost:8880/v1" spellcheck="false"></label>
        <label class="field"><span>Model</span><select data-key="localServer.model" id="local-models"></select></label>
        <label class="field"><span>Voice</span><input data-key="localServer.voice" list="local-voices" spellcheck="false"></label>
        <div class="field"><label for="local-key">API key <em>(optional)</em></label>
          <div class="secret"><input id="local-key" type="password" data-key="localServer.apiKey" autocomplete="off" spellcheck="false"></div></div>
      </div>

      <div class="engine" data-engine="system">
        <label class="field"><span>Voice</span><select data-key="system.voiceName" id="system-voices"></select></label>
      </div>
    </section>

    <section>
      <label class="field">
        <span class="row">Speed <output id="rate-out"></output></span>
        <input type="range" data-key="rate" min="0.5" max="3" step="0.1">
      </label>
      <label class="switch-row">Stop before an incomplete last sentence <input type="checkbox" role="switch" data-key="skipIncompleteLast"></label>
      <label class="switch-row">Scroll to follow the reading <input type="checkbox" role="switch" data-key="autoScroll"></label>
      <label class="switch-row">Turn Kindle pages automatically <input type="checkbox" role="switch" data-key="autoTurnPages"></label>
      <label class="switch-row">Turn early, while the page's last sentence is read <input type="checkbox" role="switch" data-key="earlyPageTurn"></label>
    </section>

    <footer>
      <!-- Filled from chrome.commands, in the platform's notation. -->
      <dl class="shortcuts" id="shortcuts"></dl>
      <button type="button" class="link-button" id="change-shortcuts">Change shortcuts</button>
      <p id="status" role="status"></p>
    </footer>
  </main>

  <datalist id="local-voices"></datalist>

  <script type="module" src="options.js"></script>
</body>
</html>
